name: Update sports calendar

on:
  push:
    branches: [main]
    paths:
      - "update_calendar.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_calendar.py
      - name: Commit refreshed calendar
        run: |
          git config user.name "sports-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sports_calendar.ics
          git diff --cached --quiet || git commit -m "Refresh sports calendar"
          git push
